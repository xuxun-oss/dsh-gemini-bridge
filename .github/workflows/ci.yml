name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: Node syntax check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check lib/index.js
        run: node --check lib/index.js

      - name: Syntax check lib/client.js
        run: node --check lib/client.js

      - name: Validate package.json
        run: node -e "const p=require('./package.json'); ['name','version','main','license'].forEach(k=>{if(!p[k]) throw new Error('missing '+k)}); console.log('package.json OK:', p.name, p.version)"
